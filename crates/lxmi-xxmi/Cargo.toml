[package]
name = "lxmi-xxmi"
version = "0.5.3"
edition = "2021"

[dependencies]
lxmi-core = { path = "../lxmi-core" }
lxmi-runtime = { path = "../lxmi-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
p384 = { version = "0.13.1", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
libc = "0.2"
tracing.workspace = true

[dev-dependencies]
lxmi-steam = { path = "../lxmi-steam" }
lxmi-proton = { path = "../lxmi-proton" }
