[package]
name = "lxmi-xxmi"
version = "0.5.1"
edition = "2021"

[dependencies]
lxmi-core = { path = "../lxmi-core" }
lxmi-runtime = { path = "../lxmi-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tracing.workspace = true

[dev-dependencies]
lxmi-steam = { path = "../lxmi-steam" }
lxmi-proton = { path = "../lxmi-proton" }
