[workspace]
resolver = "2"
members = [
  "apps/lxmi-desktop/src-tauri",
  "crates/lxmi-bridge",
  "crates/lxmi-bridge-protocol",
  "crates/lxmi-core",
  "crates/lxmi-launch",
  "crates/lxmi-mod-preview",
  "crates/lxmi-proton",
  "crates/lxmi-runtime",
  "crates/lxmi-xxmi",
  "crates/lxmi-steam",
  "tools/lxmi-bridge-helper",
]

[workspace.dependencies]
tracing = "0.1"

# Keep integrity checks usable for multi-gigabyte mod profiles during development.
[profile.dev.package.sha2]
opt-level = 3

# Previews decode large textures and rasterize millions of pixels.
[profile.dev.package.texture2ddecoder]
opt-level = 3
[profile.dev.package.lxmi-mod-preview]
opt-level = 3
